<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Kill Army - Rules</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-image: url('background.jpg'); /* Podkladová fotka */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #1e1e24; 
            color: #fff; 
            padding: 20px; 
            margin: 0; 
            text-align: center; 
        }
        
        /* 🔹 HORNÍ ZÁHLAVÍ: ZVĚTŠENÁ LOGA PO STRANÁCH A VELKÝ NÁPIS UPROSTŘED */
        header { 
            max-width: 1200px;
            margin: 0 auto 30px auto; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.2); 
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title-block {
            flex-grow: 1;
            text-align: center;
            padding: 0 20px;
        }
        .logo-side { 
            width: 140px; /* ✅ UPRAVENO: Loga zvětšena ze 100px na 140px */
            height: auto;
            flex-shrink: 0;
        }
        
        /* ✅ UPRAVENO: Hlavní nadpis zvětšen a nastaven na VELKÁ PÍSMENA (uppercase) */
        h1 { 
            color: #ff9f1c; 
            margin: 0; 
            font-size: 3.2em; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            text-shadow: 3px 3px 6px rgba(0,0,0,0.9); 
        }
        p { color: #ccc; font-size: 1.1em; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); margin-top: 8px; margin-bottom: 0; }
        
        /* Přizpůsobení pro mobily – na malém displeji dáme loga nad sebe, aby se text nemačkal */
        @media (max-width: 768px) {
            header { flex-direction: column; gap: 15px; }
            .logo-side { width: 100px; }
            h1 { font-size: 2.3em; }
        }

        /* 🔹 TLAČÍTKA JAZYKŮ */
        .lang-container { margin-bottom: 30px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .lang-button { padding: 10px 20px; font-size: 15px; font-weight: bold; background: #2a9d8f; color: white; border: none; border-radius: 4px; cursor: pointer; transition: background 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .lang-button:hover { background: #218074; }
        .lang-button.active { background: #ff9f1c; color: #1e1e24; }

        /* 🔹 TŘI SLOUPCE VEDLE SEBE PRO HRÁČE */
        .columns-container { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; text-align: left; flex-wrap: wrap; }
        
        /* ✅ UPRAVENO: Pozadí oken zesvětleno (průhlednost 0.65 místo 0.9), přibyl blur podkladu */
        .column { 
            flex: 1; 
            min-width: 300px; 
            background: rgba(50, 50, 65, 0.65); 
            padding: 20px; 
            border-radius: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            box-shadow: 0 6px 20px rgba(0,0,0,0.6); 
            backdrop-filter: blur(4px); 
        }
        
        h3 { color: #ff9f1c; border-bottom: 1px solid rgba(255, 255, 255, 0.2); padding-bottom: 8px; margin-top: 0; margin-bottom: 15px; font-size: 1.3em; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); text-align: center; }
        ul, ol { padding-left: 20px; margin: 0; color: #eee; font-size: 1.05em; line-height: 1.6; }
        
        /* ✅ UPRAVENO: Silnější stín textu u pravidel, aby šel perfektně přečíst i na světlejším podkladu */
        li { margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.9); }
        
        /* Skrytí obsahu před zvolením jazyka */
        #content-section { display: none; }
    </style>
</head>
<body>

    <!-- 🔹 HORNÍ SEKCE S LOGY PO STRANÁCH -->
    <header>
        <img class="logo-side" src="logo.png" alt="For Kill Army Logo Vlevo">
        <div class="header-title-block">
            <h1>For Kill Army</h1>
            <p id="subTitle">Vyberte jazyk pro zobrazení pravidel.</p>
        </div>
        <img class="logo-side" src="logo.png" alt="For Kill Army Logo Vpravo">
    </header>

    <!-- 🔹 VÝBĚR JAZYKŮ -->
    <div class="lang-container">
        <button class="lang-button" onclick="loadLanguageRules('cz', this)">Čeština</button>
        <button class="lang-button" onclick="loadLanguageRules('en', this)">English</button>
        <button class="lang-button" onclick="loadLanguageRules('ru', this)">Русский</button>
        <button class="lang-button" onclick="loadLanguageRules('de', this)">Deutsch</button>
        <button class="lang-button" onclick="loadLanguageRules('ua', this)">Українська</button>
        <button class="lang-button" onclick="loadLanguageRules('pl', this)">Polski</button>
    </div>

    <!-- 🔹 SEKCE SE TŘEMI SLOUPCI -->
    <main id="content-section">
        <div class="columns-container">
            
            <!-- 1. SLOUPEC: PRAVIDLA -->
            <div class="column">
                <h3 id="labelRules">Pravidla klanu</h3>
                <ol id="rulesList"></ol>
            </div>

            <!-- 2. SLOUPEC: CÍLE -->
            <div class="column">
                <h3 id="labelGoal">Co je cílem klanu</h3>
                <ul id="goalList"></ul>
            </div>

            <!-- 3. SLOUPEC: TIPY -->
            <div class="column">
                <h3>Tipy a rady</h3>
                <ul id="tipsList"></ul>
            </div>

        </div>
    </main>

    <script>
        // Slovník pro automatický překlad pevných textů a nadpisů na stránce
        const translations = {
            cz: { sub: "Vyberte jazyk pro zobrazení pravidel.", rules: "Pravidla klanu", goal: "Co je cílem klanu", tips: "Tipy a rady", emptyRules: "Žádná pravidla nebyla zadána.", emptyGoal: "Žádné klanové cíle nebyly zadány.", emptyTips: "Žádné tipy nebyly zadány.", error: "Nepodařilo se načíst pravidla pro tento jazyk." },
            en: { sub: "Select a language to display the rules.", rules: "Clan Rules", goal: "Clan Goals", tips: "Tips and Tricks", emptyRules: "No rules have been entered.", emptyGoal: "No clan goals have been entered.", emptyTips: "No tips have been entered.", error: "Failed to load rules for this language." },
            ru: { sub: "Выберите язык для отображения правил.", rules: "Правила клана", goal: "Цели клана", tips: "Советы и подсказки", emptyRules: "Правила не указаны.", emptyGoal: "Цели клана не указаны.", emptyTips: "Советы не указаны.", error: "Не удалось загрузить правила для этого языка." },
            de: { sub: "Wählen Sie eine Sprache aus, um die Regeln anzuzeigen.", rules: "Clan-Regeln", goal: "Clan-Ziele", tips: "Tipps und Ratschläge", emptyRules: "Es wurden keine Regeln eingegeben.", emptyGoal: "Es wurden keine Clan-Ziele eingegeben.", emptyTips: "Es wurden keine Tipps eingegeben.", error: "Regeln für diese Sprache konnten nicht geladen werden." },
            ua: { sub: "Виберіть мову для відображення правил.", rules: "Правила клану", goal: "Цілі клану", tips: "Поради та підказки", emptyRules: "Правила не вказані.", emptyGoal: "Цілі клану не вказані.", emptyTips: "Поради не вказані.", error: "Не вдалося завантажити правила для цієї мови." },
            pl: { sub: "Wybierz język, aby wyświetlić zasady.", rules: "Zasady klanu", goal: "Cele klanu", tips: "Porady i wskazówki", emptyRules: "Nie wprowadzono żadnych zasad.", emptyGoal: "Nie wprowadzono żadnych celów klanu.", emptyTips: "Nie wprowadzono żadnych porad.", error: "Nie udało się załadować zasad dla tego języka." }
        };

        async function loadLanguageRules(lang, buttonElement) {
            document.querySelectorAll('.lang-button').forEach(btn => btn.classList.remove('active'));
            if(buttonElement) buttonElement.classList.add('active');

            const rulesList = document.getElementById("rulesList");
            const goalList = document.getElementById("goalList");
            const tipsList = document.getElementById("tipsList");
            const contentSection = document.getElementById("content-section");
            
            const subTitle = document.getElementById("subTitle");
            const labelRules = document.getElementById("labelRules");
            const labelGoal = document.getElementById("labelGoal");
            const labelTips = document.getElementById("labelTips");

            const t = translations[lang] || translations['cz'];
            subTitle.innerText = t.sub;
            labelRules.innerText = t.rules;
            labelGoal.innerText = t.goal;
            labelTips.innerText = t.tips;

            rulesList.innerHTML = "";
            goalList.innerHTML = "";
            tipsList.innerHTML = "";

            try {
                const response = await fetch(`/rules/${lang}`);
                if (response.ok) {
                    const data = await response.json();

                    if (data.rules && data.rules.length > 0) {
                        data.rules.forEach(item => rulesList.innerHTML += `<li>${item}</li>`);
                    } else { rulesList.innerHTML = `<li>${t.emptyRules}</li>`; }

                    if (data.goal && data.goal.length > 0) {
                        data.goal.forEach(item => goalList.innerHTML += `<li>${item}</li>`);
                    } else { goalList.innerHTML = `<li>${t.emptyGoal}</li>`; }

                    if (data.tips && data.tips.length > 0) {
                        data.tips.forEach(item => tipsList.innerHTML += `<li>${item}</li>`);
                    } else { tipsList.innerHTML = `<li>${t.emptyTips}</li>`; }

                    contentSection.style.display = "block";
                } else {
                    alert(t.error);
                }
            } catch (err) {
                console.error("Chyba při stahování pravidel:", err);
            }
        }
    </script>
</body>
</html>
