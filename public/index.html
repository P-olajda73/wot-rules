<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Kill Army - Rules</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-image: url('background.jpg'); /* Podkladová fotka */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #1e1e24; 
            color: #fff; 
            padding: 20px; 
            margin: 0; 
            text-align: center; 
        }
        
        /* 🔹 HORNÍ ZÁHLAVÍ: ZVĚTŠENÁ LOGA PO STRANÁCH A VELKÝ NÁPIS UPROSTŘED */
        header { 
            max-width: 1200px;
            margin: 0 auto 30px auto; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.2); 
            padding-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title-block {
            flex-grow: 1;
            text-align: center;
            padding: 0 20px;
        }
        .logo-side { 
            width: 180px; /* ZVĚTŠENO ze 140px */
            height: auto;
            flex-shrink: 0;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6)); /* Přidán pěkný stín pod loga */
        }
        
        h1 { 
            color: #ff9f1c; 
            margin: 0; 
            font-size: 4.2em; /* ZVĚTŠENO z 3.2em */
            text-transform: uppercase; 
            letter-spacing: 3px; 
            text-shadow: 3px 3px 8px rgba(0,0,0,0.95); 
        }
        .welcome-lines p { 
            color: #ccc; 
            font-size: 1.15em; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9); 
            margin-top: 12px; 
            margin-bottom: 0; 
            font-weight: bold;
        }
        
        /* Přizpůsobení pro mobily, aby obří nápis neodcestoval z displeje */
        @media (max-width: 768px) {
            header { flex-direction: column; gap: 15px; }
            .logo-side { width: 120px; }
            h1 { font-size: 2.6em; }
        }

        /* 🔹 TLAČÍTKA JAZYKŮ */
        .lang-container { margin-bottom: 30px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .lang-button { padding: 10px 20px; font-size: 15px; font-weight: bold; background: #2a9d8f; color: white; border: none; border-radius: 4px; cursor: pointer; transition: background 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .lang-button:hover { background: #218074; }
        .lang-button.active { background: #ff9f1c; color: #1e1e24; }

        /* 🔹 TŘI SLOUPCE VEDLE SEBE PRO HRÁČE */
        .columns-container { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; text-align: left; flex-wrap: wrap; }
        
        .column { 
            flex: 1; 
            min-width: 300px; 
            background: rgba(50, 50, 65, 0.65); 
            padding: 20px; 
            border-radius: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            box-shadow: 0 6px 20px rgba(0,0,0,0.6); 
            backdrop-filter: blur(4px); 
        }
        
        h3 { color: #ff9f1c; border-bottom: 1px solid rgba(255, 255, 255, 0.2); padding-bottom: 8px; margin-top: 0; margin-bottom: 15px; font-size: 1.3em; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); text-align: center; }
        ul, ol { padding-left: 20px; margin: 0; color: #eee; font-size: 1.05em; line-height: 1.6; }
        li { margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.9); }
        
        /* Skrytí obsahu před zvolením jazyka */
        #content-section { display: none; }
    </style>
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>

    <header>
        <!-- Logo na levé straně -->
        <img src="logo.png" alt="For Kill Army Logo" class="logo-side">
        
        <div class="header-title-block">
            <h1>For Kill Army</h1>
            <div class="welcome-lines">
                <p>Vyber svůj jazyk</p>
                <p>Choose your language</p>
                <p>Выбери свой язык</p>
                <p>Wähle deine Sprache</p>
                <p>Вибери свою мову</p>
                <p>Wybierz swój język</p>
            </div>
        </div>
        
        <!-- Logo na pravé straně -->
        <img src="logo.png" alt="For Kill Army Logo" class="logo-side">
    </header>

    <div class="lang-container">
        <button id="lang-cz" class="lang-button" onclick="window.loadLanguageRules('cz', this)">🇨🇿 CZ</button>
        <button id="lang-en" class="lang-button" onclick="window.loadLanguageRules('en', this)">🇬🇧 EN</button>
        <button id="lang-ru" class="lang-button" onclick="window.loadLanguageRules('ru', this)">🇷🇺 RU</button>
        <button id="lang-de" class="lang-button" onclick="window.loadLanguageRules('de', this)">🇩🇪 DE</button>
        <button id="lang-ua" class="lang-button" onclick="window.loadLanguageRules('ua', this)">🇺🇦 UA</button>
        <button id="lang-pl" class="lang-button" onclick="window.loadLanguageRules('pl', this)">🇵🇱 PL</button>
    </div>

    <!-- TŘI SLOUPCE S OBSAHEM (Které předtím chyběly) -->
    <div id="content-section" class="columns-container">
        <div class="column">
            <h3 id="labelRules">Pravidla klanu</h3>
            <ul id="rulesList">
                <li>Načítám...</li>
            </ul>
        </div>
        <div class="column">
            <h3 id="labelGoal">Co je cílem klanu</h3>
            <ul id="goalList">
                <li>Načítám...</li>
            </ul>
        </div>
        <div class="column">
            <h3 id="labelTips">Tipy a rady</h3>
            <ul id="tipsList">
                <li>Načítám...</li>
            </ul>
        </div>
    </div>

    <script>
        window.translations = {
            "cz": { "rules": "Pravidla klanu", "goal": "Co je cílem klanu", "tips": "Tipy a rady", "emptyRules": "Žádná pravidla nebyla zadána.", "emptyGoal": "Žádné klanové cíle nebyly zadány.", "emptyTips": "Žádné tipy nebyly zadány.", "error": "Nepodařilo se načíst pravidla z databáze." },
            "en": { "rules": "Clan Rules", "goal": "Clan Goals", "tips": "Tips and Tricks", "emptyRules": "No rules have been entered.", "emptyGoal": "No clan goals have been entered.", "emptyTips": "No tips have been entered.", "error": "Failed to load rules." },
            "ru": { "rules": "Правила клана", "goal": "Цели клана", "tips": "Tips", "emptyRules": "Нет правил.", "emptyGoal": "Нет целей.", "emptyTips": "Нет советов.", "error": "Ошибка." },
            "de": { "rules": "Clan-Regeln", "goal": "Clan-Ziele", "tips": "Tipps", "emptyRules": "Keine Regeln.", "emptyGoal": "Keine Ziele.", "emptyTips": "Keine Tipps.", "error": "Fehler." },
            "ua": { "rules": "Правила клану", "goal": "Цілі клану", "tips": "Porady", "emptyRules": "Немає правил.", "emptyGoal": "Немає цілей.", "emptyTips": "Немає порад.", "error": "Помилка." },
            "pl": { "rules": "Zasady klanu", "goal": "Cele klanu", "tips": "Porady", "emptyRules": "Brak zasad.", "emptyGoal": "Brak celów.", "emptyTips": "Brak porad.", "error": "Błąd." }
        };

        function arrayToHtmlList(arr, emptyMessage) {
            if (!arr || !Array.isArray(arr) || arr.length === 0) {
                return '<li>' + emptyMessage + '</li>';
            }
            var html = '';
            for (var i = 0; i < arr.length; i++) {
                if (arr[i] && arr[i].trim() !== '') {
                    html += '<li>' + arr[i] + '</li>';
                }
            }
            return html === '' ? '<li>' + emptyMessage + '</li>' : html;
        }

        window.loadLanguageRules = async function(lang, buttonElement) {
            console.log("Požadavek na jazyk:", lang);

            var buttons = document.getElementsByClassName('lang-button');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            if (buttonElement) {
                buttonElement.classList.add('active');
            } else {
                var targetBtn = document.getElementById('lang-' + lang);
                if (targetBtn) targetBtn.classList.add('active');
            }

            var rulesList = document.getElementById("rulesList");
            var goalList = document.getElementById("goalList");
            var tipsList = document.getElementById("tipsList");
            
            var labelRules = document.getElementById("labelRules");
            var labelGoal = document.getElementById("labelGoal");
            var labelTips = document.getElementById("labelTips");

            var t = window.translations[lang] || window.translations['cz'];
            
            if (labelRules) labelRules.innerText = t.rules;
            if (labelGoal) labelGoal.innerText = t.goal;
            if (labelTips) labelTips.innerText = t.tips;

            if (rulesList) rulesList.innerHTML = '<li>Načítám...</li>';
            if (goalList) goalList.innerHTML = '<li>Načítám...</li>';
            if (tipsList) tipsList.innerHTML = '<li>Načítám...</li>';

            // Zobrazení sekce se sloupci
            var contentSection = document.getElementById("content-section");
            if (contentSection) contentSection.style.display = "flex";

            var apiLang = lang === 'cz' ? 'cs' : lang;

            try {
                var response = await fetch('/rules/' + apiLang);
                if (!response.ok) throw new Error('Chyba serveru: ' + response.status);

                var data = await response.json();

                if (data) {
                    if (rulesList) rulesList.innerHTML = arrayToHtmlList(data.rules, t.emptyRules);
                    if (goalList) goalList.innerHTML = arrayToHtmlList(data.goal, t.emptyGoal);
                    if (tipsList) tipsList.innerHTML = arrayToHtmlList(data.tips, t.emptyTips);
