<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Kill Army - Rules</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-image: url('background.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #1e1e24; 
            color: #fff; 
            padding: 20px; 
            margin: 0; 
            text-align: center; 
        }
        
        header { 
            max-width: 1200px;
            margin: 0 auto 30px auto; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.2); 
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title-block {
            flex-grow: 1;
            text-align: center;
            padding: 0 20px;
        }
        
        .logo-side { 
            height: 180px; 
            width: auto; 
            flex-shrink: 0;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6));
        }
        
        .logo-side-right {
            height: 194px; 
        }
        
        h1 { 
            color: #ff9f1c; 
            margin: 0; 
            font-size: 4.2em; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            text-shadow: 3px 3px 8px rgba(0,0,0,0.95); 
        }
        
        p { 
            color: #ccc; 
            font-size: 1.2em; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9); 
            margin-top: 10px; 
            margin-bottom: 0; 
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            header { flex-direction: column; gap: 15px; }
            .logo-side { height: 110px; }
            .logo-side-right { height: 118px; }
            h1 { font-size: 2.8em; }
        }

        .lang-container { margin-bottom: 30px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .lang-button { padding: 10px 20px; font-size: 15px; font-weight: bold; background: #2a9d8f; color: white; border: none; border-radius: 4px; cursor: pointer; transition: background 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .lang-button:hover { background: #218074; }
        .lang-button.active { background: #ff9f1c; color: #1e1e24; }

        .columns-container { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; text-align: left; flex-wrap: wrap; }
        
        .column { 
            flex: 1; 
            min-width: 300px; 
            background: rgba(50, 50, 65, 0.65); 
            padding: 20px; 
            border-radius: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            box-shadow: 0 6px 20px rgba(0,0,0,0.6); 
            backdrop-filter: blur(4px); 
        }
        
        h3 { color: #ff9f1c; border-bottom: 1px solid rgba(255, 255, 255, 0.2); padding-bottom: 8px; margin-top: 0; margin-bottom: 15px; font-size: 1.3em; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); text-align: center; }
        ul, ol { padding-left: 20px; margin: 0; color: #eee; font-size: 1.05em; line-height: 1.6; }
        li { margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.9); }
        
        #content-section { display: none; }
    </style>
</head>
<body>

    <header>
        <img class="logo-side" src="logo.png" alt="For Kill Army Logo Vlevo">
        <div class="header-title-block">
            <h1>For Kill Army</h1>
            <p id="subTitle">Vyberte jazyk pro zobrazení pravidel.</p>
        </div>
        <img class="logo-side logo-side-right" src="logo.png" alt="For Kill Army Logo Vpravo">
    </header>

    <div class="lang-container">
        <button id="lang-cz" class="lang-button" onclick="loadLanguageRules('cz', this)">Čeština</button>
        <button id="lang-en" class="lang-button" onclick="loadLanguageRules('en', this)">English</button>
        <button id="lang-ru" class="lang-button" onclick="loadLanguageRules('ru', this)">Русский</button>
        <button id="lang-de" class="lang-button" onclick="loadLanguageRules('de', this)">Deutsch</button>
        <button id="lang-ua" class="lang-button" onclick="loadLanguageRules('ua', this)">Ukrajinština</button>
        <button id="lang-pl" class="lang-button" onclick="loadLanguageRules('pl', this)">Polski</button>
    </div>

    <main id="content-section">
        <div class="columns-container">
            
            <div class="column">
                <h3 id="labelRules">Pravidla klanu</h3>
                <ol id="rulesList"></ol>
            </div>

            <div class="column">
                <h3 id="labelGoal">Co je cílem klanu</h3>
                <ul id="goalList"></ul>
            </div>

            <div class="column">
                <h3 id="labelTips">Tipy a rady</h3>
                <ul id="tipsList"></ul>
            </div>

        </div>
    </main>

    <script>
        var translations = {
            "cz": { "sub": "Vyberte jazyk pro zobrazení pravidel.", "rules": "Pravidla klanu", "goal": "Co je cílem klanu", "tips": "Tipy a rady", "emptyRules": "Žádná pravidla nebyla zadána.", "emptyGoal": "Žádné klanové cíle nebyly zadány.", "emptyTips": "Žádné tipy nebyly zadány.", "error": "Nepodařilo se načíst pravidla z databáze." },
            "en": { "sub": "Select a language to display the rules.", "rules": "Clan Rules", "goal": "Clan Goals", "tips": "Tips and Tricks", "emptyRules": "No rules have been entered.", "emptyGoal": "No clan goals have been entered.", "emptyTips": "No tips have been entered.", "error": "Failed to load rules from database." },
            "ru": { "sub": "Vyberite jazyk dlia otobrazenia pravil.", "rules": "Pravila klana", "goal": "Celi klana", "tips": "Sovety i podskazki", "emptyRules": "Pravila ne ukazany.", "emptyGoal": "Celi ne ukazany.", "emptyTips": "Sovety ne ukazany.", "error": "Oshibka BD." },
            "de": { "sub": "Wählen Sie eine Sprache aus.", "rules": "Clan-Regeln", "goal": "Clan-Ziele", "tips": "Tipps", "emptyRules": "Keine Regeln.", "emptyGoal": "Keine Ziele.", "emptyTips": "Keine Tipps.", "error": "Fehler." },
            "ua": { "sub": "Vyberit movu dlia pravyl.", "rules": "Pravyla klanu", "goal": "Cili klanu", "tips": "Porady", "emptyRules": "Nema pravil.", "emptyGoal": "Nema cilei.", "emptyTips": "Nema porad.", "error": "Pomilka." },
            "pl": { "sub": "Wybierz jezyk.", "rules": "Zasady klanu", "goal": "Cele klanu", "tips": "Porady", "emptyRules": "Brak zasad.", "emptyGoal": "Brak celow.", "emptyTips": "Brak porad.", "error": "Blad." }
        };

        // Pomocná funkce pro převod textu (rozděleného enterem) na HTML body <li>
        function textToHtmlList(text, emptyMessage) {
            if (!text || text.trim() === '') {
                return '<li>' + emptyMessage + '</li>';
            }
            // Rozdělí text podle konců řádků a očistí prázdné řádky
            var lines = text.split(/\r?\n/);
            var html = '';
            for (var i = 0; i < lines.length; i++) {
                if (lines[i].trim() !== '') {
                    html += '<li>' + lines[i] + '</li>';
                }
            }
            return html;
        }

        async function loadLanguageRules(lang, buttonElement) {
            // 1. Vizuální přepnutí tlačítek
            var buttons = document.getElementsByClassName('lang-button');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            if (buttonElement) {
                buttonElement.classList.add('active');
            } else {
                var targetBtn = document.getElementById('lang-' + lang);
                if (targetBtn) targetBtn.classList.add('active');
            }

            // 2. Příprava prvků z DOM
            var rulesList = document.getElementById("rulesList");
            var goalList = document.getElementById("goalList");
            var tipsList = document.getElementById("tipsList");
            var contentSection = document.getElementById("content-section");
            
            var subTitle = document.getElementById("subTitle");
            var labelRules = document.getElementById("labelRules");
            var labelGoal = document.getElementById("labelGoal");
            var labelTips = document.getElementById("labelTips");

            var t = translations[lang] || translations['cz'];
            
            // 3. Dosazení lokálních statických překladů pro nadpisy
            if (subTitle) subTitle.innerText = t.sub;
            if (labelRules) labelRules.innerText = t.rules;
            if (labelGoal) labelGoal.innerText = t.goal;
            if (labelTips) labelTips.innerText = t.tips;

            // Indikace načítání, než dorazí odpověď z databáze
            if (rulesList) rulesList.innerHTML = '<li>Načítám...</li>';
            if (goalList) goalList.innerHTML = '<li>Načítám...</li>';
            if (tipsList) tipsList.innerHTML = '<li>Načítám...</li>';
            
            // Zobrazíme sekci se sloupci (změna z display: none na block)
            if (contentSection) contentSection.style.display = 'block';

            // 4. Převod zkratky 'cz' na 'cs' kvůli backend API endpointu /rules/cs
            var apiLang = lang === 'cz' ? 'cs' : lang;

            try {
                // Fetch volání na backend běžící na Renderu
                var response = await fetch('/rules/' + apiLang);
                
                if (!response.ok) {
                    throw new Error('Chyba serveru: ' + response.status);
                }

                var data = await response.json();

                // 5. Vykreslení dat z MongoDB do sloupců
                if (data) {
