<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - For Kill Army</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .admin-container { max-width: 700px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2, h3 { color: #333; }
        .input-group { display: flex; margin-bottom: 8px; }
        .text-input { flex: 1; padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        .delete-button { margin-left: 8px; padding: 8px 12px; color: white; background-color: #dc3545; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .button { padding: 8px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        .button:hover { background-color: #218838; }
        #saveRules { display: block; width: 100%; padding: 12px; background-color: #007bff; font-size: 16px; margin-top: 25px; }
        #saveRules:hover { background-color: #0069d9; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>Admin Panel - For Kill Army</h1>
        <h2>Správa Pravidiel</h2>
    
        <div style="margin-bottom: 20px;">
            <label for="language" style="font-weight: bold;">Vyber jazyk pro úpravu:</label>
            <select id="language" style="padding: 6px; font-size: 14px; margin-left: 10px;">
                <option value="cz">Čeština</option>
                <option value="en">English</option>
                <option value="ru">Ruština</option>
                <option value="de">Nemčina</option>
                <option value="ua">Ukrajinčina</option>
                <option value="pl">Polština</option>
            </select>
        </div>

        <div class="section">
            <h3>Tipy a rady</h3>
            <div id="tipsContainer">
                <div class="input-group"><input type="text" data-type="tips" class="text-input" value="Zde napište první klanový tip..."><button class="delete-button" onclick="this.parentElement.remove()">X</button></div>
            </div>
            <button id="addTip" class="button" onclick="addInputField('tipsContainer', 'tips')">Pridať nový řádek</button>
        </div>

        <div class="section" style="margin-top: 20px;">
            <h3>Cieľ klanu</h3>
            <div id="goalContainer">
                <div class="input-group"><input type="text" data-type="goal" class="text-input" value="Zde napište první cíl klanu..."><button class="delete-button" onclick="this.parentElement.remove()">X</button></div>
            </div>
            <button id="addGoal" class="button" onclick="addInputField('goalContainer', 'goal')">Pridať nový řádek</button>
        </div>

        <div class="section" style="margin-top: 20px;">
            <h3>Pravidlá klanu</h3>
            <div id="rulesContainer">
                <div class="input-group"><input type="text" data-type="rules" class="text-input" value="Zde napište první pravidlo..."><button class="delete-button" onclick="this.parentElement.remove()">X</button></div>
            </div>
            <button id="addRule" class="button" onclick="addInputField('rulesContainer', 'rules')">Pridať nový řádek</button>
        </div>

        <button id="saveRules" class="button">Uložiť pravidlá do databázy</button>
    </div>

    <script>
        // Funkce pro přidání nového prázdného pole přímo na obrazovku
        function addInputField(containerId, type) {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = 'input-group';
            div.innerHTML = `
                <input type="text" data-type="${type}" class="text-input" value="">
                <button class="delete-button" onclick="this.parentElement.remove()">X</button>
            `;
            container.appendChild(div);
        }

        // Funkce pro odeslání dat na server Render a zápis do MongoDB
        document.getElementById("saveRules").addEventListener("click", async () => {
            const currentLanguage = document.getElementById("language").value;
            const updatedRules = { tips: [], goal: [], rules: [] };

            document.querySelectorAll("input[data-type=tips]").forEach((input) => {
                if (input.value.trim()) updatedRules.tips.push(input.value.trim());
            });

            document.querySelectorAll("input[data-type=goal]").forEach((input) => {
                if (input.value.trim()) updatedRules.goal.push(input.value.trim());
            });

            document.querySelectorAll("input[data-type=rules]").forEach((input) => {
                if (input.value.trim()) updatedRules.rules.push(input.value.trim());
            });

            try {
                const response = await fetch(`/rules/${currentLanguage}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(updatedRules)
                });

                if (!response.ok) throw new Error("Chyba při komunikaci se serverem.");
                alert("Pravidlá boli úspešne uložené do databázy!");
            } catch (error) {
                console.error("Chyba:", error);
                alert("Nepodařilo se uložit data. Zkontrolujte připojení.");
            }
        });
    </script>
</body>
</html>
