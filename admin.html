<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - For Kill Army</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e24; color: #fff; padding: 30px; }
        .box { max-width: 600px; margin: 0 auto; background: #2a2a35; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .header-admin { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 15px; }
        h1, h2 { text-align: center; color: #ff9f1c; margin: 0; }
        .input-group { display: flex; margin-bottom: 10px; }
        input { flex: 1; padding: 10px; border: none; border-radius: 4px; font-size: 14px; }
        .btn-del { margin-left: 10px; background: #e63946; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn { padding: 10px 15px; background: #2a9d8f; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        .btn-logout { background: #555; padding: 8px 12px; font-size: 12px; }
        .btn-logout:hover { background: #e63946; }
        #save { display: block; width: 100%; padding: 12px; background: #ff9f1c; color: #1e1e24; font-size: 16px; font-weight: bold; margin-top: 20px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <script>
        // 🔒 ZÁMEK: Pokud v paměti prohlížeče chybí příznak přihlášení, okamžitě odhodíme uživatele na login.html
        if (localStorage.getItem("loggedIn") !== "true") {
            window.location.href = "login.html";
        }
    </script>

    <div class="box">
        <div class="header-admin">
            <h1>For Kill Army</h1>
            <button class="btn btn-logout" id="logoutBtn">Odhlásit se</button>
        </div>
        <h2>Správa klanových pravidel</h2>
    
        <div style="margin-bottom: 20px; text-align: center;">
            <label style="font-weight: bold;">Zvolit jazyk pro uložení:</label>
            <select id="lang" style="padding: 5px; margin-left: 10px; font-size: 14px;">
                <option value="cz">Čeština</option>
                <option value="en">English</option>
                <option value="ru">Ruština</option>
                <option value="de">Němčina</option>
            </select>
        </div>

        <div>
            <h3>Pravidla klanu</h3>
            <div id="rulesArea">
                <div class="input-group"><input type="text" class="r-input" value="Napište první klanové pravidlo..."><button class="btn-del" onclick="this.parentElement.remove()">X</button></div>
            </div>
            <button class="btn" onclick="addNode()">+ Přidat další řádek pravidel</button>
        </div>

        <button id="save">ULOŽIT PRAVIDLA DO DATABÁZE</button>
    </div>

    <script>
        // Funkce pro odhlášení z administrace
        document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.setItem("loggedIn", "false");
            window.location.href = "login.html";
        });

        function addNode() {
            const area = document.getElementById('rulesArea');
            const div = document.createElement('div');
            div.className = 'input-group';
            div.innerHTML = '<input type="text" class="r-input" value=""><button class="btn-del" onclick="this.parentElement.remove()">X</button>';
            area.appendChild(div);
        }

        document.getElementById("save").addEventListener("click", async () => {
            const language = document.getElementById("lang").value;
            const payload = { tips: ["Aktivní klan"], goal: ["Vítězství v bitvách"], rules: [] };

            document.querySelectorAll(".r-input").forEach((input) => {
                if (input.value.trim()) payload.rules.push(input.value.trim());
            });

            try {
                const response = await fetch(`/rules/${language}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("ÚSPĚCH! Pravidla byla trvale uložena do vaší databáze MongoDB!");
                } else {
                    alert("Chyba při ukládání na server.");
                }
            } catch (err) {
                alert("Nelze se spojit se serverem.");
            }
        });
    </script>
</body>
</html>
