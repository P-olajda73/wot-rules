<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - For Kill Army</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e24; color: #fff; padding: 20px; margin: 0; }
        .box { max-width: 1200px; margin: 0 auto; background: #2a2a35; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .header-admin { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 15px; }
        h1, h2 { text-align: center; color: #ff9f1c; margin: 0; }
        
        /* 🔹 TŘI SLOUPCE VEDLE SEBE */
        .columns-container { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .column { flex: 1; min-width: 300px; background: #22222b; padding: 15px; border-radius: 6px; border: 1px solid #3a3a45; display: flex; flex-direction: column; justify-content: space-between; }
        
        h3 { color: #2a9d8f; border-bottom: 1px solid #3a3a45; padding-bottom: 5px; margin-top: 0; margin-bottom: 15px; }
        .inputs-wrapper { flex-grow: 1; }
        .input-group { display: flex; margin-bottom: 10px; }
        input { flex: 1; padding: 10px; border: none; border-radius: 4px; font-size: 14px; background: #fff; color: #000; }
        .btn-del { margin-left: 10px; background: #e63946; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn { padding: 10px 15px; background: #2a9d8f; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; width: 100%; display: block; text-align: center; box-sizing: border-box; }
        .btn-logout { background: #555; padding: 8px 12px; font-size: 12px; width: auto; display: inline-block; margin-top: 0; }
        .btn-logout:hover { background: #e63946; }
        #save { display: block; width: 100%; padding: 15px; background: #ff9f1c; color: #1e1e24; font-size: 18px; font-weight: bold; margin-top: 30px; border: none; border-radius: 4px; cursor: pointer; letter-spacing: 1px; }
        #save:hover { background: #e68a00; }
    </style>
</head>
<body>

    <script>
        // 🔒 ZÁMEK: Pokud v paměti chybí příznak přihlášení, okamžitě odhodíme uživatele na login.html
        if (localStorage.getItem("loggedIn") !== "true") {
            window.location.href = "login.html";
        }
    </script>

    <div class="box">
        <div class="header-admin">
            <h1>For Kill Army</h1>
            <button class="btn btn-logout" id="logoutBtn">Odhlásit se</button>
        </div>
        <h2>Správa klanových pravidel</h2>
    
        <div style="margin-bottom: 20px; text-align: center; margin-top: 15px;">
            <label style="font-weight: bold; font-size: 16px;">Zvolit jazyk pro úpravu:</label>
            <select id="lang" style="padding: 6px; margin-left: 10px; font-size: 15px; border-radius: 4px; cursor: pointer;">
                <option value="cz">Čeština</option>
                <option value="en">English</option>
                <option value="ru">Ruština</option>
                <option value="de">Němčina</option>
                <option value="ua">Ukrajinčina</option>
                <option value="pl">Polština</option>
            </select>
        </div>

        <!-- 🔹 KONTEJNER PRO SLOUPCE VEDLE SEBE -->
        <div class="columns-container">
            
            <!-- 1. SLOUPEC: PRAVIDLA KLANU -->
            <div class="column">
                <div class="inputs-wrapper">
                    <h3>Pravidla klanu</h3>
                    <div id="rulesArea"></div>
                </div>
                <button class="btn" onclick="addNode('rulesArea', 'r-input', '')">+ Přidat řádek pravidel</button>
            </div>

            <!-- 2. SLOUPEC: CO JE CÍLEM KLANU -->
            <div class="column">
                <div class="inputs-wrapper">
                    <h3>Co je cílem klanu?</h3>
                    <div id="goalArea"></div>
                </div>
                <button class="btn" onclick="addNode('goalArea', 'g-input', '')">+ Přidat řádek cílů</button>
            </div>

            <!-- 3. SLOUPEC: TIPY A RADY -->
            <div class="column">
                <div class="inputs-wrapper">
                    <h3>Tipy a rady</h3>
                    <div id="tipsArea"></div>
                </div>
                <button class="btn" onclick="addNode('tipsArea', 't-input', '')">+ Přidat řádek tipů</button>
            </div>

        </div>

        <button id="save">ULOŽIT VŠE DO DATABÁZE</button>
    </div>

    <script>
        // Funkce pro odhlášení z administrace
        document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.setItem("loggedIn", "false");
            window.location.href = "login.html";
        });

        // Funkce pro dynamické přidávání nových řádků
        function addNode(areaId, inputClass, value) {
            const area = document.getElementById(areaId);
            const div = document.createElement('div');
            div.className = 'input-group';
            div.innerHTML = `<input type="text" class="${inputClass}" value="${value}"><button class="btn-del" onclick="this.parentElement.remove()">X</button>`;
            area.appendChild(div);
        }

        // 🔄 Funkce: Načte stávající data z databáze a vyplní je do políček
        async function loadCurrentRules() {
            const language = document.getElementById("lang").value;
            
            // Vyčistíme stará pole na obrazovce
            document.getElementById("tipsArea").innerHTML = "";
            document.getElementById("goalArea").innerHTML = "";
            document.getElementById("rulesArea").innerHTML = "";

            try {
                const response = await fetch(`/rules/${language}`);
                if (response.ok) {
                    const data = await response.json();
                    
                    // Pokud data v DB existují, vykreslíme je do políček
                    if (data.rules && data.rules.length > 0) data.rules.forEach(val => addNode('rulesArea', 'r-input', val));
                    else addNode('rulesArea', 'r-input', 'Napište první klanové pravidlo...');

                    if (data.goal && data.goal.length > 0) data.goal.forEach(val => addNode('goalArea', 'g-input', val));
                    else addNode('goalArea', 'g-input', 'Napište první cíl klanu...');

                    if (data.tips && data.tips.length > 0) data.tips.forEach(val => addNode('tipsArea', 't-input', val));
                    else addNode('tipsArea', 't-input', 'Napište první klanový tip...');
                } else {
                    // Pokud pro daný jazyk nic v DB není, dáme jedno prázdné pole na začátek
                    addNode('rulesArea', 'r-input', '');
                    addNode('goalArea', 'g-input', '');
                    addNode('tipsArea', 't-input', '');
                }
            } catch (err) {
                console.error("Chyba při načítání dat:", err);
            }
        }

        // Načíst data při změně jazyka v menu
        document.getElementById("lang").addEventListener("change", loadCurrentRules);

        // Načíst data automaticky ihned při otevření stránky admin panelu
        loadCurrentRules();

        // Funkce pro odeslání všech sekcí najednou do MongoDB
        document.getElementById("save").addEventListener("click", async () => {
            const language = document.getElementById("lang").value;
            const payload = { tips: [], goal: [], rules: [] };

            document.querySelectorAll(".t-input").forEach((input) => {
                if (input.value.trim()) payload.tips.push(input.value.trim());
            });

            document.querySelectorAll(".g-input").forEach((input) => {
                if (input.value.trim()) payload.goal.push(input.value.trim());
            });

            document.querySelectorAll(".r-input").forEach((input) => {
                if (input.value.trim()) payload.rules.push(input.value.trim());
            });

            try {
                const response = await fetch(`/rules/${language}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("ÚSPĚCH! Pravidla, cíle i tipy byla trvale uložena do vaší databáze MongoDB!");
                    loadCurrentRules(); // Znovu načteme čistá data pro kontrolu
                } else {
                    alert("Chyba při ukládání na server.");
                }
            } catch (err) {
                alert("Nelze se spojit se serverem.");
            }
        });
    </script>
</body>
</html>
